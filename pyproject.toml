[project]
name = "first-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Zoe",email = "zoe@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.133.0,<0.134.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.2.0,<8.0.0)",
    "sqlalchemy (>=2.0.47,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pgvector (<0.4)",
    "psycopg-binary (>=3.3.3,<4.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "langchain (>=1.2.10,<2.0.0)",
    "langchain-ollama (>=1.0.1,<2.0.0)",
    "langchain-postgres (>=0.0.17,<0.0.18)",
    "litellm (>=1.81.15,<2.0.0)",
    "pypdf (>=6.7.3,<7.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
