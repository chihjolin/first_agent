version: '3.8'

# 定義專屬網路(使用 alias 避免變數替換問題)，隔離環境
networks:
  agent_net:
    name: ${PROJECT_NAME}_network
    driver: bridge

# 定義共用環境變數模組
x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
  OLLAMA_BASE_URL: http://${OLLAMA_HOST}:${OLLAMA_PORT}

# 定義共用的 Image 模板，讓四個服務共用同一個 build context，省下重複 build 的時間
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  #1. API Gateway(FastAPI)
  api:
    build:
      <<: *app-build
    container_name: ${PROJECT_NAME}_api
    env_file: .env
    # 這裡就是取代 Dockerfile CMD 的地方：指定啟動 FastAPI
    command: uvicorn src.api.main:app --host 0.0.0.0 --port ${API_PORT} --reload
    volumes:
      - ./src:/app/src
      - ./shared_uploads:/app/temp_uploads # 上傳檔案儲存目錄共同掛載到本機的 shared_uploads
    ports:
      - "${API_HOST_PORT}:${API_PORT}"
    networks:
      - agent_net
    environment:
      # FastAPI 專屬：使用 +asyncpg 啟動非同步資料庫連線，徹底解放併發效能
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully # 等 Migration 跑完才啟動

  # 2. 推論大腦 Worker (處理 Agent 對話、呼叫 LangChain 與工具)
  agent-worker:
    build:
      <<: *app-build
    container_name: ${PROJECT_NAME}_agent_worker
    env_file: .env
    # 指定啟動 Celery，並且只監聽名為 inference_queue 的佇列
    command: celery -A src.agent_runtime.tasks worker -Q inference_queue --loglevel=info
    volumes:
      - ./src:/app/src
    networks:
      - agent_net
    environment:
      <<: *common-env
      # Worker 專屬：使用傳統同步連線 (psycopg-binary)，確保長時間運算穩定
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully

  # 3. 消化器官 Worker (處理 PDF 切塊、呼叫 Embedding 轉向量)
  ingestion-worker:
    build:
      <<: *app-build
    container_name: ${PROJECT_NAME}_ingestion_worker
    env_file: .env
    # 指定啟動 Celery，並且只監聽名為 document_queue 的佇列
    command: celery -A src.ingestion.tasks worker -Q document_queue --loglevel=info
    volumes:
      - ./src:/app/src
      - ./shared_uploads:/app/temp_uploads # Worker 也能讀到同一個資料夾
    networks:
      - agent_net
    environment:
      <<: *common-env
      # Worker 專屬：使用傳統同步連線 (psycopg-binary)，確保長時間運算穩定
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully

  # 4. Message Broker (任務佇列與緩衝區) 
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    env_file: .env
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    networks:
      - agent_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Database (PostgreSQL + pgvector 擴充)
  db:
    image: pgvector/pgvector:pg16
    container_name: ${PROJECT_NAME}_db
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    networks:
      - agent_net
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 確保 DB 真的啟動完畢，API 和 Worker 才去連線，避免啟動時 Crash
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5.5 資料庫遷移服務 (One-off Task)
  migration:
    build:
      <<: *app-build
    env_file: .env
    # 跑完就退出 (One-off)的容器，讓 Docker 自己產生隨機容器名字．否則第二次啟動會name conflict
    # 執行完 upgrade head 後自動退出
    command: alembic upgrade head
    # [Production]一次性升級作業不需要熱更新（bind mount）
    networks:
      - agent_net
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy

  # 6. AI 模型推論引擎
  ollama:
    image: ollama/ollama:latest
    container_name: ${PROJECT_NAME}_ollama
    env_file: .env
    ports:
      - "${OLLAMA_HOST_PORT}:${OLLAMA_PORT}"
    networks:
      - agent_net
    volumes:
      # 將下載的模型存在本機，避免容器重啟後要重抓
      - ollama_models:/root/.ollama
    # Ollama 搭配 WSL2 GPU 穿透
    # docker compose V2 標準寫法
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_VISIBLE_DEVICES}
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # 7. 模型初始化 Worker
  ollama-init:
    image: ollama/ollama:latest #直接用官方 Image，內建 CLI，不用再安裝
    container_name: ${PROJECT_NAME}_ollama_init
    env_file: .env
    networks:
      - agent_net
    volumes:
      # 同樣掛載 models，這樣 Init 容器抓完模型，本體也能直接讀取
      - ollama_models:/root/.ollama
      - ./scripts/ollama-init.sh:/ollama-init.sh
    entrypoint: [ "/bin/sh", "/ollama-init.sh" ]
    depends_on:
      ollama:
        condition: service_healthy # 等待本體 Server 確定活著才開始做事

volumes:
  pgdata:
    name: ${PROJECT_NAME}_db_data
  ollama_models:
    name: ${PROJECT_NAME}_ollama_data
